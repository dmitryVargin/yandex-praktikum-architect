{
  "openapi": "3.0.3",
  "info": {
    "title": "Telemetry Service API",
    "version": "1.0.0"
  },
  "paths": {
    "/readings": {
      "post": {
        "summary": "Create telemetry reading",
        "operationId": "createReading",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/CreateReadingDto" },
              "examples": {
                "example": {
                  "value": {
                    "sensorId": "1",
                    "timestamp": "2025-09-30T22:37:03.042Z",
                    "value": 25.07,
                    "unit": "C"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/TelemetryReading" }
              }
            }
          },
          "400": { "description": "Bad Request" }
        }
      },
      "get": {
        "summary": "Find telemetry readings",
        "operationId": "findReadings",
        "parameters": [
          {
            "name": "sensorId",
            "in": "query",
            "schema": { "type": "string" },
            "required": false
          },
          {
            "name": "from",
            "in": "query",
            "schema": { "type": "string", "format": "date-time" },
            "required": false
          },
          {
            "name": "to",
            "in": "query",
            "schema": { "type": "string", "format": "date-time" },
            "required": false
          },
          {
            "name": "limit",
            "in": "query",
            "schema": { "type": "integer", "minimum": 1, "maximum": 5000, "default": 1000 },
            "required": false
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": { "$ref": "#/components/schemas/TelemetryReading" }
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "CreateReadingDto": {
        "type": "object",
        "required": ["sensorId", "value", "unit"],
        "properties": {
          "sensorId": { "type": "string" },
          "timestamp": { "type": "string", "format": "date-time" },
          "value": { "type": "number" },
          "unit": {
            "type": "string",
            "enum": ["C", "F", "HPa", "Percent"]
          }
        }
      },
      "TelemetryReading": {
        "type": "object",
        "properties": {
          "_id": { "type": "string" },
          "sensorId": { "type": "string" },
          "timestamp": { "type": "string", "format": "date-time" },
          "value": { "type": "number" },
          "unit": {
            "type": "string",
            "enum": ["C", "F", "HPa", "Percent"]
          }
        },
        "required": ["_id", "sensorId", "timestamp", "value", "unit"]
      }
    }
  }
}