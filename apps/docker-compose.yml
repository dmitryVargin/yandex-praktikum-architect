version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      - POSTGRES_USER=smarthome_admin
      - POSTGRES_PASSWORD=my_super_secure_password_123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: temperature-api
    environment:
      - PORT=8081
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network

  telemetry-mongodb:
    image: mongo:7.0
    container_name: telemetry-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=telemetry_admin
      - MONGO_INITDB_ROOT_PASSWORD=telemetry_password
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - smarthome-network

  telemetry-service:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    container_name: telemetry-service
    depends_on:
      telemetry-mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - PORT=8082
      - MONGO_URI=mongodb://telemetry_admin:telemetry_password@telemetry-mongodb:27017/telemetry?authSource=admin
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=sensor.events
    ports:
      - "8082:8082"
    restart: unless-stopped
    networks:
      - smarthome-network

  # Kafka stack
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: smarthome-zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_PURGEINTERVAL=1
      - ZOO_AUTOPURGE_SNAPRETAINCOUNT=3
    volumes:
      - zookeeper_data:/bitnami/zookeeper
    networks:
      - smarthome-network

  kafka:
    image: bitnami/kafka:3.6
    depends_on:
      - zookeeper
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    ports:
      - "29092:29092" # host access if needed
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - smarthome-network

  sensors-service-db:
    image: postgres:16-alpine
    container_name: sensors-service-db
    environment:
      POSTGRES_USER: dc_user
      POSTGRES_PASSWORD: dc_pass
      POSTGRES_DB: sensors-service-db
    ports:
      - "5432:5432"
    volumes:
      - sensors-service-db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smarthome-network

  sensors-service:
    build:
      context: ./sensors-service
      dockerfile: Dockerfile
    container_name: sensors-service
    depends_on:
      sensors-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - PORT=3000
      - DB_HOST=sensors-service-db
      - DB_PORT=5432
      - DB_USERNAME=dc_user
      - DB_PASSWORD=dc_pass
      - DB_DATABASE=sensors-service-db
      - DB_SYNCHRONIZE=true
      - DB_SSL=false
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=sensor.events
    ports:
      - "8083:3000"
    restart: unless-stopped
    networks:
      - smarthome-network

  monolith:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
      kafka:
        condition: service_healthy

    environment:
      - DATABASE_URL=postgres://smarthome_admin:my_super_secure_password_123@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=sensor.events
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:
  mongo_data:
  sensors-service-db_data:
  zookeeper_data:

networks:
  smarthome-network:
    driver: bridge